openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: courses
    description: Course catalog operations
  - name: categories
    description: Course category operations
  - name: testimonials
    description: Learner testimonials
  - name: stats
    description: Platform-wide statistics
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: admin
    description: Admin-only course and lesson management
  - name: orders
    description: Course enrollment and Naira payment orders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List courses
      description: Returns all courses, optionally filtered by category or featured flag
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a course by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Not found
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List course categories
      description: Returns categories with course counts
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /testimonials:
    get:
      operationId: listTestimonials
      tags: [testimonials]
      summary: List learner testimonials
      responses:
        "200":
          description: List of testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Platform-wide stats summary
      description: Aggregate counts used for landing page trust indicators
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /admin/courses/{courseId}/modules:
    post:
      operationId: createCourseModule
      tags: [admin]
      summary: Create a curriculum module for a course (admin only)
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleBody"
      responses:
        "201":
          description: Module created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModule"
        "401":
          description: Not authenticated
        "403":
          description: Not an admin
  /admin/modules/{moduleId}/lessons:
    post:
      operationId: createLesson
      tags: [admin]
      summary: Add a lesson to a course module (admin only)
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLessonBody"
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          description: Not authenticated
        "403":
          description: Not an admin
        "404":
          description: Module not found
  /admin/lessons/{id}:
    patch:
      operationId: updateLesson
      tags: [admin]
      summary: Update a lesson (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLessonBody"
      responses:
        "200":
          description: Lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          description: Lesson not found
    delete:
      operationId: deleteLesson
      tags: [admin]
      summary: Delete a lesson (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Lesson deleted
        "404":
          description: Lesson not found
  /courses/{courseId}/modules/{moduleId}/lessons:
    get:
      operationId: listModuleLessons
      tags: [courses]
      summary: List lessons in a curriculum module
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a pending Naira payment order to enroll in a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Not authenticated
        "404":
          description: Course not found
    get:
      operationId: listMyOrders
      tags: [orders]
      summary: List the current user's orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Not authenticated
  /site-templates:
    get:
      operationId: listSiteTemplates
      tags: [websites]
      summary: List available website templates
      responses:
        "200":
          description: Available starter templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteTemplate"
  /websites:
    get:
      operationId: listMyWebsites
      tags: [websites]
      summary: List the current user's websites
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Websites owned by the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Website"
        "401":
          description: Not authenticated
    post:
      operationId: installWebsiteTemplate
      tags: [websites]
      summary: Create a website from a starter template
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteInstallInput"
      responses:
        "201":
          description: Installed website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "400":
          description: Invalid request or template
        "401":
          description: Not authenticated
  /websites/{slug}:
    get:
      operationId: getMyWebsite
      tags: [websites]
      summary: Get an owned website and its draft
      parameters:
        - $ref: "#/components/parameters/WebsiteSlug"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Website owned by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "401":
          description: Not authenticated
        "404":
          description: Website not found
  /websites/{slug}/draft:
    put:
      operationId: saveWebsiteDraft
      tags: [websites]
      summary: Save changes to an owned website draft
      parameters:
        - $ref: "#/components/parameters/WebsiteSlug"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteDraftInput"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "400":
          description: Invalid website content
        "401":
          description: Not authenticated
        "404":
          description: Website not found
  /websites/{slug}/publish:
    post:
      operationId: publishWebsite
      tags: [websites]
      summary: Publish the current draft for an owned website
      parameters:
        - $ref: "#/components/parameters/WebsiteSlug"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Published website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "401":
          description: Not authenticated
        "404":
          description: Website not found
  /published-websites/{slug}:
    get:
      operationId: getPublishedWebsite
      tags: [websites]
      summary: Get the public version of a published website
      parameters:
        - $ref: "#/components/parameters/WebsiteSlug"
      responses:
        "200":
          description: Public website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedWebsite"
        "404":
          description: Website is not published
  /website-manifests/{slug}:
    get:
      operationId: getWebsiteManifest
      tags: [websites]
      summary: Get the install manifest for a published website
      parameters:
        - $ref: "#/components/parameters/WebsiteSlug"
      responses:
        "200":
          description: PWA manifest for the published website
          content:
            application/manifest+json:
              schema:
                $ref: "#/components/schemas/WebsiteManifest"
        "404":
          description: Website is not published
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    WebsiteSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Course:
      type: object
      required:
        - id
        - title
        - slug
        - summary
        - category
        - instructorName
        - level
        - lessonsCount
        - durationWeeks
        - studentsCount
        - rating
        - reviewsCount
        - priceCents
        - originalPriceCents
        - isFree
        - isFeatured
        - imageUrl
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        summary:
          type: string
        category:
          type: string
        instructorName:
          type: string
        level:
          type: string
        lessonsCount:
          type: integer
        durationWeeks:
          type: integer
        studentsCount:
          type: integer
        rating:
          type: number
        reviewsCount:
          type: integer
        priceCents:
          type: integer
        originalPriceCents:
          type: ["integer", "null"]
        isFree:
          type: boolean
        isFeatured:
          type: boolean
        imageUrl:
          type: string
    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          required:
            - description
            - whatYouWillLearn
            - curriculum
          properties:
            description:
              type: string
            whatYouWillLearn:
              type: array
              items:
                type: string
            curriculum:
              type: array
              items:
                $ref: "#/components/schemas/CurriculumModule"
    CurriculumModule:
      type: object
      required:
        - id
        - title
        - lessonsCount
      properties:
        id:
          type: integer
        title:
          type: string
        lessonsCount:
          type: integer
    AdminModule:
      type: object
      required:
        - id
        - courseId
        - title
        - lessonsCount
        - position
      properties:
        id:
          type: integer
        courseId:
          type: integer
        title:
          type: string
        lessonsCount:
          type: integer
        position:
          type: integer
    CreateModuleBody:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        position:
          type: integer
    Lesson:
      type: object
      required:
        - id
        - moduleId
        - courseId
        - title
        - contentUrl
        - durationMinutes
        - position
        - isPreview
      properties:
        id:
          type: integer
        moduleId:
          type: integer
        courseId:
          type: integer
        title:
          type: string
        contentUrl:
          type: ["string", "null"]
        durationMinutes:
          type: integer
        position:
          type: integer
        isPreview:
          type: boolean
    CreateLessonBody:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        contentUrl:
          type: string
        durationMinutes:
          type: integer
        position:
          type: integer
        isPreview:
          type: boolean
    UpdateLessonBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        contentUrl:
          type: string
        durationMinutes:
          type: integer
        position:
          type: integer
        isPreview:
          type: boolean
    CreateOrderBody:
      type: object
      required:
        - courseId
      properties:
        courseId:
          type: integer
    Order:
      type: object
      required:
        - id
        - userId
        - courseId
        - amountKobo
        - status
        - reference
        - createdAt
      properties:
        id:
          type: integer
        userId:
          type: string
        courseId:
          type: integer
        amountKobo:
          type: integer
        status:
          type: string
        reference:
          type: string
        createdAt:
          type: string
          format: date-time
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, role]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        role:
          type: string
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Category:
      type: object
      required:
        - id
        - name
        - slug
        - courseCount
        - icon
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        courseCount:
          type: integer
        icon:
          type: string
    Testimonial:
      type: object
      required:
        - id
        - name
        - role
        - quote
        - rating
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        quote:
          type: string
        rating:
          type: number
    StatsSummary:
      type: object
      required:
        - enrolledLearners
        - totalCourses
        - totalCategories
        - averageRating
        - expertInstructors
      properties:
        enrolledLearners:
          type: integer
        totalCourses:
          type: integer
        totalCategories:
          type: integer
        averageRating:
          type: number
        expertInstructors:
          type: integer
    SiteTemplate:
      type: object
      required: [slug, name, niche, description, previewImage, features, document]
      properties:
        slug:
          type: string
        name:
          type: string
        niche:
          type: string
        description:
          type: string
        previewImage:
          type: string
        features:
          type: array
          items:
            type: string
        document:
          $ref: "#/components/schemas/WebsiteDocument"
    WebsiteInstallInput:
      type: object
      required: [templateSlug]
      properties:
        templateSlug:
          type: string
          minLength: 1
          maxLength: 80
        name:
          type: string
          minLength: 2
          maxLength: 60
    WebsiteDraftInput:
      type: object
      required: [name, document]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        document:
          $ref: "#/components/schemas/WebsiteDocument"
    Website:
      type: object
      required: [id, ownerId, templateSlug, slug, name, draft, published, createdAt, updatedAt, publishedAt]
      properties:
        id:
          type: integer
        ownerId:
          type: string
        templateSlug:
          type: string
        slug:
          type: string
        name:
          type: string
        draft:
          $ref: "#/components/schemas/WebsiteDocument"
        published:
          oneOf:
            - $ref: "#/components/schemas/WebsiteDocument"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: ["string", "null"]
          format: date-time
    PublishedWebsite:
      type: object
      required: [templateSlug, slug, name, document, publishedAt]
      properties:
        templateSlug:
          type: string
        slug:
          type: string
        name:
          type: string
        document:
          $ref: "#/components/schemas/WebsiteDocument"
        publishedAt:
          type: string
          format: date-time
    WebsiteDocument:
      type: object
      required: [appName, tagline, logoUrl, primaryColor, accentColor, backgroundColor, textColor, font, footerText, pages]
      properties:
        appName:
          type: string
          minLength: 2
          maxLength: 60
        tagline:
          type: string
          maxLength: 180
        logoUrl:
          type: ["string", "null"]
          maxLength: 2048
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        backgroundColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        textColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        font:
          type: string
          enum: [modern, editorial, friendly]
        footerText:
          type: string
          maxLength: 300
        pages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/WebsitePage"
    WebsitePage:
      type: object
      required: [slug, title, sections]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 60
        title:
          type: string
          minLength: 1
          maxLength: 60
        sections:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/WebsiteSection"
    WebsiteSection:
      type: object
      required: [id, type, enabled, heading, body, imageUrl, buttonLabel, buttonHref, items]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        type:
          type: string
          enum: [hero, features, about, services, gallery, testimonials, contact]
        enabled:
          type: boolean
        heading:
          type: string
          maxLength: 120
        body:
          type: string
          maxLength: 1200
        imageUrl:
          type: ["string", "null"]
          maxLength: 2048
        buttonLabel:
          type: ["string", "null"]
          maxLength: 60
        buttonHref:
          type: ["string", "null"]
          maxLength: 2048
        items:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/WebsiteSectionItem"
    WebsiteSectionItem:
      type: object
      required: [heading, body, imageUrl]
      properties:
        heading:
          type: string
          maxLength: 100
        body:
          type: string
          maxLength: 500
        imageUrl:
          type: ["string", "null"]
