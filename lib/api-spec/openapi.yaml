openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: courses
    description: Course catalog operations
  - name: categories
    description: Course category operations
  - name: testimonials
    description: Learner testimonials
  - name: stats
    description: Platform-wide statistics
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: admin
    description: Admin-only course and lesson management
  - name: orders
    description: Course enrollment and Naira payment orders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List courses
      description: Returns all courses, optionally filtered by category or featured flag
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a course by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Not found
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List course categories
      description: Returns categories with course counts
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /testimonials:
    get:
      operationId: listTestimonials
      tags: [testimonials]
      summary: List learner testimonials
      responses:
        "200":
          description: List of testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Platform-wide stats summary
      description: Aggregate counts used for landing page trust indicators
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /admin/courses/{courseId}/modules:
    post:
      operationId: createCourseModule
      tags: [admin]
      summary: Create a curriculum module for a course (admin only)
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleBody"
      responses:
        "201":
          description: Module created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModule"
        "401":
          description: Not authenticated
        "403":
          description: Not an admin
  /admin/modules/{moduleId}/lessons:
    post:
      operationId: createLesson
      tags: [admin]
      summary: Add a lesson to a course module (admin only)
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLessonBody"
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          description: Not authenticated
        "403":
          description: Not an admin
        "404":
          description: Module not found
  /admin/lessons/{id}:
    patch:
      operationId: updateLesson
      tags: [admin]
      summary: Update a lesson (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLessonBody"
      responses:
        "200":
          description: Lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          description: Lesson not found
    delete:
      operationId: deleteLesson
      tags: [admin]
      summary: Delete a lesson (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Lesson deleted
        "404":
          description: Lesson not found
  /courses/{courseId}/modules/{moduleId}/lessons:
    get:
      operationId: listModuleLessons
      tags: [courses]
      summary: List lessons in a curriculum module
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
  /admin/integrations:
    get:
      operationId: listAdminIntegrations
      tags: [admin]
      summary: List provider configuration status without exposing credentials
      responses:
        "200":
          description: Provider settings and masked configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationSettingsResponse"
        "401":
          description: Not authenticated
        "403":
          description: Not an admin
  /admin/integrations/{providerId}:
    put:
      operationId: saveAdminIntegration
      tags: [admin]
      summary: Add or rotate an encrypted provider credential
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/IntegrationProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationCredentialInput"
      responses:
        "200":
          description: Provider credential saved; a rotated key must be tested again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationSetting"
        "400":
          description: Invalid provider configuration
        "401":
          description: Not authenticated
        "403":
          description: Not an admin or cross-origin request
    patch:
      operationId: updateAdminIntegration
      tags: [admin]
      summary: Enable or disable a configured provider
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/IntegrationProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationToggleInput"
      responses:
        "200":
          description: Updated provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationSetting"
        "400":
          description: Provider must be configured and tested before it can be enabled
        "401":
          description: Not authenticated
        "403":
          description: Not an admin or cross-origin request
        "404":
          description: Provider configuration not found
    delete:
      operationId: deleteAdminIntegration
      tags: [admin]
      summary: Remove an encrypted provider credential
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/IntegrationProviderId"
      responses:
        "204":
          description: Provider credential removed
        "401":
          description: Not authenticated
        "403":
          description: Not an admin or cross-origin request
        "404":
          description: Provider configuration not found
  /admin/integrations/{providerId}/test:
    post:
      operationId: testAdminIntegration
      tags: [admin]
      summary: Test a provider credential without returning it
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/IntegrationProviderId"
      responses:
        "200":
          description: Credential test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationTestResult"
        "400":
          description: Provider credential cannot be tested this way
        "401":
          description: Not authenticated
        "403":
          description: Not an admin or cross-origin request
        "404":
          description: Provider configuration not found
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a Paystack bank-transfer checkout for a course or jewellery masterclass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order and Paystack checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCheckout"
        "401":
          description: Not authenticated
        "404":
          description: Course not found
        "503":
          description: Paystack checkout is not configured
    get:
      operationId: listMyOrders
      tags: [orders]
      summary: List the current user's orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Not authenticated
  /orders/{reference}/verify:
    post:
      operationId: verifyOrderPayment
      tags: [orders]
      summary: Verify a Paystack payment before granting access
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current verified order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Not authenticated
        "404":
          description: Order not found
        "502":
          description: Paystack could not verify the transaction
  /domains/search:
    get:
      operationId: searchDomains
      tags: [domains]
      summary: Check availability and pricing for a full domain name
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 253
      responses:
        "200":
          description: Registrar availability and price result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainSearchResult"
        "400":
          description: Invalid domain name
        "503":
          description: NiceNIC domain search is not configured
  /my-domains:
    get:
      operationId: listMyDomains
      tags: [domains]
      summary: List domains and registration status for the current user
      responses:
        "200":
          description: The current user's domain registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainPurchase"
        "401":
          description: Not authenticated
  /domain-orders:
    post:
      operationId: createDomainOrder
      tags: [domains]
      summary: Create a Paystack checkout for one or more domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainOrderInput"
      responses:
        "201":
          description: Domain order and Paystack checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainOrderCheckout"
        "400":
          description: Invalid order or unavailable domain
        "401":
          description: Not authenticated
        "409":
          description: A domain in the cart already has an active order
        "503":
          description: Domain registrar, exchange rate, or Paystack is not configured
  /domain-orders/{reference}/verify:
    post:
      operationId: verifyDomainOrderPayment
      tags: [domains]
      summary: Verify a domain checkout and register paid domains
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified order and current registration results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainOrderVerification"
        "401":
          description: Not authenticated
        "404":
          description: Domain order not found
        "502":
          description: Paystack could not verify the transaction
  /paystack/webhook:
    post:
      operationId: receivePaystackWebhook
      tags: [orders]
      summary: Receive signed Paystack payment events
      parameters:
        - name: Paystack-Signature
          in: header
          required: false
          schema:
            type: string
        - name: x-paystack-signature
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaystackWebhookInput"
      responses:
        "200":
          description: Event accepted
        "401":
          description: Invalid webhook signature
        "503":
          description: Paystack is not configured
  /site-templates:
    get:
      operationId: listSiteTemplates
      tags: [websites]
      summary: List available website templates
      responses:
        "200":
          description: Available starter templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteTemplate"
  /websites:
    get:
      operationId: listMyWebsites
      tags: [websites]
      summary: List the current user's websites
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Websites owned by the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Website"
        "401":
          description: Not authenticated
    post:
      operationId: installWebsiteTemplate
      tags: [websites]
      summary: Create a website from a starter template
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteInstallInput"
      responses:
        "201":
          description: Installed website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "400":
          description: Invalid request or template
        "401":
          description: Not authenticated
  /websites/{slug}:
    get:
      operationId: getMyWebsite
      tags: [websites]
      summary: Get an owned website and its draft
      parameters:
        - $ref: "#/components/parameters/WebsiteSlug"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Website owned by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "401":
          description: Not authenticated
        "404":
          description: Website not found
  /websites/{slug}/draft:
    put:
      operationId: saveWebsiteDraft
      tags: [websites]
      summary: Save changes to an owned website draft
      parameters:
        - $ref: "#/components/parameters/WebsiteSlug"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteDraftInput"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "400":
          description: Invalid website content
        "401":
          description: Not authenticated
        "404":
          description: Website not found
  /websites/{slug}/publish:
    post:
      operationId: publishWebsite
      tags: [websites]
      summary: Publish the current draft for an owned website
      parameters:
        - $ref: "#/components/parameters/WebsiteSlug"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Published website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "401":
          description: Not authenticated
        "404":
          description: Website not found
  /published-websites/{slug}:
    get:
      operationId: getPublishedWebsite
      tags: [websites]
      summary: Get the public version of a published website
      parameters:
        - $ref: "#/components/parameters/WebsiteSlug"
      responses:
        "200":
          description: Public website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedWebsite"
        "404":
          description: Website is not published
  /website-manifests/{slug}:
    get:
      operationId: getWebsiteManifest
      tags: [websites]
      summary: Get the install manifest for a published website
      parameters:
        - $ref: "#/components/parameters/WebsiteSlug"
      responses:
        "200":
          description: PWA manifest for the published website
          content:
            application/manifest+json:
              schema:
                $ref: "#/components/schemas/WebsiteManifest"
        "404":
          description: Website is not published
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    WebsiteSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Course:
      type: object
      required:
        - id
        - title
        - slug
        - summary
        - category
        - instructorName
        - level
        - lessonsCount
        - durationWeeks
        - studentsCount
        - rating
        - reviewsCount
        - priceCents
        - originalPriceCents
        - isFree
        - isFeatured
        - imageUrl
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        summary:
          type: string
        category:
          type: string
        instructorName:
          type: string
        level:
          type: string
        lessonsCount:
          type: integer
        durationWeeks:
          type: integer
        studentsCount:
          type: integer
        rating:
          type: number
        reviewsCount:
          type: integer
        priceCents:
          type: integer
        originalPriceCents:
          type: ["integer", "null"]
        isFree:
          type: boolean
        isFeatured:
          type: boolean
        imageUrl:
          type: string
    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          required:
            - description
            - whatYouWillLearn
            - curriculum
          properties:
            description:
              type: string
            whatYouWillLearn:
              type: array
              items:
                type: string
            curriculum:
              type: array
              items:
                $ref: "#/components/schemas/CurriculumModule"
    CurriculumModule:
      type: object
      required:
        - id
        - title
        - lessonsCount
      properties:
        id:
          type: integer
        title:
          type: string
        lessonsCount:
          type: integer
    AdminModule:
      type: object
      required:
        - id
        - courseId
        - title
        - lessonsCount
        - position
      properties:
        id:
          type: integer
        courseId:
          type: integer
        title:
          type: string
        lessonsCount:
          type: integer
        position:
          type: integer
    CreateModuleBody:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        position:
          type: integer
    Lesson:
      type: object
      required:
        - id
        - moduleId
        - courseId
        - title
        - contentUrl
        - durationMinutes
        - position
        - isPreview
      properties:
        id:
          type: integer
        moduleId:
          type: integer
        courseId:
          type: integer
        title:
          type: string
        contentUrl:
          type: ["string", "null"]
        durationMinutes:
          type: integer
        position:
          type: integer
        isPreview:
          type: boolean
    CreateLessonBody:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        contentUrl:
          type: string
        durationMinutes:
          type: integer
        position:
          type: integer
        isPreview:
          type: boolean
    UpdateLessonBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        contentUrl:
          type: string
        durationMinutes:
          type: integer
        position:
          type: integer
        isPreview:
          type: boolean
    OrderInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        courseId:
          type: integer
        productCode:
          type: string
          enum: [jewellery-masterclass]
    IntegrationProviderId:
      type: string
      enum: [paystack, paystack_webhook, nicenic, resend, openrouter, openai, anthropic, gemini, mistral, deepseek]
    IntegrationSetting:
      type: object
      required: [providerId, label, category, description, configured, enabled, status, lastTestedAt, updatedAt, senderEmail, usdToNgnRate, canTest]
      properties:
        providerId:
          $ref: "#/components/schemas/IntegrationProviderId"
        label:
          type: string
        category:
          type: string
          enum: [payments, domains, notifications, ai]
        description:
          type: string
        configured:
          type: boolean
        enabled:
          type: boolean
        status:
